name: Build executables

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.package }} (${{ matrix.platform }}-x64)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            package: edup-client
            config: client
            extension: .exe
            archive: zip
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            package: edup-client
            config: client
            extension: ''
            archive: tar.gz
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            package: edup-server
            config: server
            extension: ''
            archive: tar.gz
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: ${{ matrix.package }}
      TARGET: ${{ matrix.target }}
      CONFIG: ${{ matrix.config }}
      EXTENSION: ${{ matrix.extension }}
      ARCHIVE_NAME: ${{ matrix.package }}-${{ matrix.platform }}-x64
      ARCHIVE_FILE: dist/${{ matrix.package }}-${{ matrix.platform }}-x64.${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "$TARGET"

      - name: Install eBPF toolchain and linker
        if: matrix.package == 'edup-server'
        # Keep these versions in sync with edup-server/build.rs and README.md.
        run: |
          rustup toolchain install nightly-2026-09-26 --profile minimal --component rust-src
          curl --fail --location --retry 3 \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.1/bpf-linker-x86_64-unknown-linux-musl.tar.zst \
            --output "$RUNNER_TEMP/bpf-linker.tar.zst"
          echo "e058a6aecc9e65fa4c977b298a8e4b738424d7629769fd352eed409fb57e16e8  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bpf-linker"
          tar --zstd -xf "$RUNNER_TEMP/bpf-linker.tar.zst" -C "$RUNNER_TEMP/bpf-linker"
          echo "$RUNNER_TEMP/bpf-linker" >> "$GITHUB_PATH"

      - name: Build release executable
        run: cargo +stable build --locked --release --target "$TARGET" -p "$PACKAGE"

      - name: Validate example configuration
        run: '"target/$TARGET/release/$PACKAGE$EXTENSION" --config "config/$CONFIG.example.json" check'

      - name: Stage package
        run: |
          mkdir -p "dist/$ARCHIVE_NAME"
          cp "target/$TARGET/release/$PACKAGE$EXTENSION" "dist/$ARCHIVE_NAME/"
          cp "config/$CONFIG.example.json" README.md "dist/$ARCHIVE_NAME/"
          if [ "$PACKAGE" = edup-server ]; then
            cp -r deploy "dist/$ARCHIVE_NAME/"
          fi

      - name: Archive Linux package
        if: runner.os == 'Linux'
        # Preserve executable permissions when downloaded from Actions.
        run: tar -czf "$ARCHIVE_FILE" -C dist "$ARCHIVE_NAME"

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:ARCHIVE_NAME" -DestinationPath "$env:ARCHIVE_FILE"

      - name: Upload executable package
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Upload the archive as-is instead of wrapping it in another zip.
          # The artifact is named after the file; `name` is ignored.
          path: ${{ env.ARCHIVE_FILE }}
          archive: false
          if-no-files-found: error

      - name: Link artifact in job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "[$(basename "$ARCHIVE_FILE")]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
